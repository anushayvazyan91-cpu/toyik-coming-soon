<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TOYIK — Coming Soon</title>
  <meta name="description" content="TOYIK is a new destination for thoughtfully selected toys and gifts. Launching soon in the U.S.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #f8f6f2;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 50px 24px;
    }

    .logo {
      font-size: 42px;
      font-weight: 500;
      letter-spacing: 14px;
      margin-bottom: 80px;
      padding-left: 14px;
    }

    h1 {
      max-width: 850px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(52px, 7vw, 92px);
      font-weight: 400;
      line-height: 0.98;
      letter-spacing: -3px;
      margin-bottom: 38px;
    }

    .description {
      max-width: 650px;
      font-size: 20px;
      line-height: 1.6;
      color: #6c6863;
      margin-bottom: 28px;
    }

    .launching {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #b56f55;
      margin-bottom: 70px;
    }

    .divider {
      width: 70px;
      height: 1px;
      background: #d9d3ca;
      margin-bottom: 28px;
    }

    .contact {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #77716b;
      margin-bottom: 10px;
    }

    .email {
      color: #171717;
      text-decoration: none;
      font-size: 16px;
    }

    .email:hover {
      text-decoration: underline;
    }

    .footer {
      position: absolute;
      bottom: 24px;
      font-size: 12px;
      color: #aaa39b;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 30px;
        letter-spacing: 10px;
        padding-left: 10px;
        margin-bottom: 55px;
      }

      h1 {
        font-size: 52px;
        letter-spacing: -2px;
      }

      .description {
        font-size: 17px;
      }

      .launching {
        letter-spacing: 2px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="logo">TOYIK</div>

    <h1>Something special<br>is coming.</h1>

    <p class="description">
      A new destination for thoughtfully selected toys and gifts.
    </p>

    <p class="launching">Launching soon in the U.S.</p>

    <div class="divider"></div>

    <p class="contact">Partnership inquiries</p>

    <a class="email" href="mailto:partnerships@toyik.com">
      partnerships@toyik.com
    </a>

    <div class="footer">© 2026 TOYIK</div>

  </main>
</body>
</html>
